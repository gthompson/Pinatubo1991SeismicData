name: pinatubo_fair
# Minimal environment for the conversion and analysis notebooks. FloVoPy is installed
# afterwards from its checkout (pip install -e ../flovopy). FloVoPy's own flovopy_asl.yml
# builds the fuller environment used to develop and run this pipeline.
channels:
  - conda-forge

dependencies:
  - python>=3.11
  - numpy
  - scipy
  - pandas
  - matplotlib
  - obspy
  - pyarrow        # Parquet export of the full analysis metrics
  - jupyterlab
  - ipython
  - nbconvert
  - pytest
  - pip
